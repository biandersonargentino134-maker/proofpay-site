<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProofPay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="i18n.js"></script>
<script src="require-auth.js"></script>
<style>
:root{
  --bg:#FAFAF9; --surface:#FFFFFF; --ink:#15171E; --ink-soft:#63666F; --ink-faint:#9A9CA4;
  --line:#E7E7E4; --accent:#4338CA; --accent-2:#6D5CE0; --accent-soft:#EEEDFB;
  --success:#17803D; --success-soft:#EAF6EE; --warn:#B45309; --warn-soft:#FDF3E4;
  --danger:#C0362C; --danger-soft:#FBEAE8;
  --r:14px; --r-lg:20px; --shadow:0 1px 2px rgba(20,20,30,.04), 0 8px 24px -12px rgba(20,20,30,.10);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;height:100%}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3,.disp{font-family:'Space Grotesk',Inter,sans-serif;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent-soft)}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:Inter;font-weight:600;font-size:14.5px;padding:11px 20px;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{opacity:.88}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{opacity:.9}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:#F2F2F0}
.btn-sm{padding:8px 14px;font-size:13.5px}
.btn-block{width:100%;justify-content:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px}
.shadow{box-shadow:var(--shadow)}
.muted{color:var(--ink-soft)}
.faint{color:var(--ink-faint)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:100px}
.b-progress{background:var(--accent-soft);color:var(--accent)}
.b-wait{background:var(--warn-soft);color:var(--warn)}
.b-success{background:var(--success-soft);color:var(--success)}
.b-neutral{background:#F1F1EF;color:var(--ink-soft)}
.b-danger{background:var(--danger-soft);color:var(--danger)}
input,textarea{font-family:Inter;font-size:14.5px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;width:100%;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
label{font-size:13px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:6px}
.field{margin-bottom:16px}
/* --- app shell --- */
#appShell{display:none;min-height:100%}
#appShell.show{display:flex}
.sidebar{width:232px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:9px;padding:6px 10px 22px}
.brand .mark{width:26px;height:26px;border-radius:8px;background:var(--ink)}
.brand span{font-family:'Space Grotesk';font-weight:700;font-size:17px}
.navlink{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:14.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;margin-bottom:2px}
.navlink svg{width:18px;height:18px;flex:none}
.navlink:hover{background:#F4F4F2}
.navlink.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navsplit{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
.profcell{display:flex;align-items:center;gap:10px;padding:8px 10px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:700}
.main{flex:1;min-width:0}
.topbar{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;background:rgba(250,250,249,.9);backdrop-filter:blur(6px);z-index:5}
.searchbox{display:flex;align-items:center;gap:8px;background:#F2F2F0;border-radius:10px;padding:9px 13px;width:280px;color:var(--ink-faint);font-size:13.5px}
.topbar-right{display:flex;align-items:center;gap:16px}
.balancepill{display:flex;align-items:center;gap:7px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13.5px;padding:8px 13px;border-radius:100px}
.content{padding:28px 30px 60px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.statlabel{font-size:13px;color:var(--ink-soft);font-weight:500;margin-bottom:10px}
.statval{font-family:'Space Grotesk';font-size:27px;font-weight:700}
.rowitem{display:flex;align-items:center;justify-content:between;gap:14px;padding:15px 4px;border-bottom:1px solid var(--line)}
.rowitem:last-child{border-bottom:none}
.icobox{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex:none}
.icobox svg{width:18px;height:18px;color:var(--accent)}
svg{stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.criteria{display:flex;gap:10px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.criteria:last-child{border-bottom:none}
.crit-ok{color:var(--success)}
.crit-no{color:var(--danger)}
.timeline{display:flex;flex-direction:column}
.tl-item{display:flex;gap:14px;padding-bottom:22px;position:relative}
.tl-item:last-child{padding-bottom:0}
.tl-dot{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--success);color:#fff;position:relative;z-index:1}
.tl-dot.pending{background:var(--accent);animation:pulse 1.8s infinite}
.tl-dot.todo{background:#EDEDEA;border:1px solid var(--line)}
.tl-line{position:absolute;left:10px;top:22px;bottom:-22px;width:2px;background:var(--line)}
.tl-item:last-child .tl-line{display:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(67,56,202,.35)}50%{box-shadow:0 0 0 6px rgba(67,56,202,0)}}
.screen{display:none;min-height:100%}
.screen.show{display:block}
.hairline{height:1px;background:var(--line);margin:26px 0}
.pill-net{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:100px;background:#F1F1EF;color:var(--ink-soft)}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:12px 4px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--ink-soft);font-weight:600;font-size:12.5px}
.aipanel{background:linear-gradient(180deg,var(--accent-soft),#fff);border:1px solid #DEDBFA;border-radius:var(--r-lg);padding:22px}
.dots{display:flex;gap:5px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media(max-width:880px){
  .sidebar{display:none}
  .grid4{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr}
  .searchbox{display:none}
  .content{padding:18px}
  .wrap{padding:0 18px}
  #appShell.show{padding-bottom:64px}
  .bottomnav{display:flex}
}
.bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:20}
.bottomnav .bnitem{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--ink-faint);cursor:pointer}
.bottomnav .bnitem.active{color:var(--accent)}
.bottomnav svg{width:20px;height:20px}
.modalbg{position:fixed;inset:0;background:rgba(15,15,20,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modalbg.show{display:flex}
.modal{background:#fff;border-radius:var(--r-lg);max-width:440px;width:100%;padding:28px}
/* ---- ProofPay hero (dark + metallic) ---- */
.pp-hero{position:relative;overflow:hidden;min-height:640px;background:radial-gradient(120% 90% at 78% 0%,#1c1d22 0%,#0a0a0c 55%),#0a0a0c}
.pp-hero .wrap{position:relative;z-index:2}
.pp-mark{background:linear-gradient(135deg,#f2f3f5,#84868d)!important}
.pp-badge{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#d7d8dc}
.btn.pp-btn-primary{background:linear-gradient(135deg,#f5f6f8,#b9bbc1);color:#0a0a0c;border-color:transparent}
.btn.pp-btn-primary:hover{opacity:.9}
.btn.pp-btn-ghost{background:transparent;border-color:rgba(255,255,255,.2);color:#fff}
.btn.pp-btn-ghost:hover{background:rgba(255,255,255,.08)}
.pp-ring{position:absolute;border:1px solid rgba(255,255,255,.06);border-radius:50%;z-index:1}
.pp-ring.r1{width:680px;height:680px;top:-240px;right:-200px}
.pp-ring.r2{width:440px;height:440px;top:-70px;right:-30px}
.pp-chainwrap{position:absolute;right:-10px;top:0;width:440px;height:560px;z-index:1;pointer-events:none}
.pp-chainwrap svg{width:100%;height:100%;display:block}
@media(max-width:980px){.pp-chainwrap{display:none}}
@media(max-width:640px){.pp-hero h1{font-size:36px!important}}
.pp-section{background:#0a0a0c;color:#fff}
.pp-card-dark{background:#131316;border:1px solid rgba(255,255,255,.09);border-radius:var(--r-lg)}
.pp-line{border-color:rgba(255,255,255,.09)!important}
.pp-num{background:linear-gradient(135deg,#f5f6f8,#8e9096);color:#0a0a0c;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Space Grotesk';margin-bottom:14px}
.pp-muted{color:rgba(255,255,255,.6)}
.pp-faint{color:rgba(255,255,255,.42)}
.pp-check{color:#4ADE80}
.pp-auth{min-height:100vh;background:radial-gradient(120% 90% at 50% 0%,#1c1d22 0%,#0a0a0c 60%),#0a0a0c;display:flex;align-items:center;justify-content:center;padding:24px}
.pp-auth input{background:#1a1b1f;border:1px solid rgba(255,255,255,.12);color:#fff}
.pp-auth input::placeholder{color:rgba(255,255,255,.35)}
.pp-auth input:focus{outline:2px solid #c7c9ce;border-color:#c7c9ce}
.pp-auth label{color:rgba(255,255,255,.55)}
</style>
</head>
<body>

<!-- ============ LANDING ============ -->
<div class="screen show" id="screen-landing"></div>
<!-- ============ AUTH ============ -->
<div class="screen" id="screen-auth"></div>
<!-- ============ APP SHELL ============ -->
<div id="appShell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content" id="appContent"></div>
  </div>
</div>
<div class="bottomnav" id="bottomnav"></div>
<div class="modalbg" id="modalbg"><div class="modal" id="modalBody"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.462.0/umd/lucide.min.js"></script>
<script>
/* ---------- ICONS (mini inline set, stroke uses currentColor) ---------- */
const I = {
 grid:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
 file:'<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
 search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
 briefcase:'<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="13" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',
 wallet:'<svg viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg>',
 user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>',
 help:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2-3 4"/><path d="M12 17h.01"/></svg>',
 logout:'<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>',
 settings:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
 bell:'<svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',
 plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
 chevr:'<svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',
 check:'<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
 x:'<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
 shield:'<svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V5z"/></svg>',
 spark:'<svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/></svg>',
 upload:'<svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>',
 link:'<svg viewBox="0 0 24 24"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><path d="M8 12h8"/></svg>',
 star:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8l-6.2 3.2L7 14.2 2 9.3l6.9-1z"/></svg>',
 arrowR:'<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
 dash:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12h8M12 8v8"/></svg>',
};
const money = n => '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:0})+' USDC';

/* ---------- SHARED APP SHELL ---------- */
const NAV = [
 ['dashboard','nav_dashboard',I.grid],
 ['acordos','nav_agreements',I.file],
 ['explorar','nav_explore',I.search],
 ['servicos','nav_myservices',I.briefcase],
 ['carteira','nav_wallet',I.wallet],
 ['perfil','nav_profile',I.user],
];
let ppCurrentNav = 'dashboard';
function renderShell(active){
 ppCurrentNav = active;
 document.getElementById('sidebar').innerHTML = `
  <div class="brand"><div class="mark"></div><span>ProofPay</span></div>
  ${NAV.map(([id,labelKey,ic])=>`<div class="navlink ${active===id?'active':''}" onclick="go('${id}')">${ic}${ppT(labelKey)}</div>`).join('')}
  <div class="navsplit">
   <div class="navlink" onclick="go('dashboard')">${I.help}${ppT('nav_help')}</div>
   <div class="navlink" onclick="go('dashboard')">${I.settings}${ppT('nav_settings')}</div>
   <div class="navlink" onclick="ppLogout()">${I.logout}${ppT('btn_logout')}</div>
  <div class="profcell"><div class="avatar">${ppAccount.initials}</div><div><div style="font-size:13.5px;font-weight:600">${ppAccount.name}</div><div class="faint" style="font-size:11.5px">${ppAccount.walletVerified ? ppT('account_wallet_verified') : ppT('account_wallet_pending')}</div></div></div>
  </div>`;
 document.getElementById('topbar').innerHTML = `
  <div class="searchbox">${I.search}${ppT('search_placeholder')}</div>
  <div class="topbar-right">
    ${I.bell}
    <div class="balancepill">${I.wallet}${money(1250)}</div>
    <div class="avatar">${ppAccount.initials}</div>
    <button class="btn btn-accent btn-sm" onclick="go('novo-acordo')">${I.plus}${ppT('btn_new_agreement')}</button>
  </div>`;
 document.getElementById('bottomnav').innerHTML = [['dashboard',I.dash],['acordos',I.file],['explorar',I.search],['carteira',I.wallet],['perfil',I.user]]
  .map(([id,ic])=>`<div class="bnitem ${active===id?'active':''}" onclick="go('${id}')">${ic}</div>`).join('');
}

/* ---------- HERO CHAIN GRAPHIC (blocos acorrentados) ---------- */
const PP_CHAIN = `<svg viewBox="0 0 480 560" xmlns="http://www.w3.org/2000/svg">
<defs>

</defs>
<line x1="360" y1="60" x2="270" y2="150" stroke="url(#gLink)" stroke-width="7" stroke-linecap="round" opacity=".9"/>
<line x1="270" y1="150" x2="380" y2="250" stroke="url(#gLink)" stroke-width="7" stroke-linecap="round" opacity=".9"/>

<line x1="250" y1="360" x2="370" y2="470" stroke="url(#gLink)" stroke-width="7" stroke-linecap="round" opacity=".9"/>
<g>
 <polygon points="331,43 360,26 389,43 360,60" fill="url(#gTop)" stroke="rgba(255,255,255,.3)" stroke-width="1"/>
 <polygon points="389,43 389,77 360,94 360,60" fill="url(#gRight)"/>
 <polygon points="360,94 331,77 331,43 360,60" fill="url(#gLeft)"/>
</g>
<g>
 <polygon points="225,124 270,98 315,124 270,150" fill="url(#gTop)" stroke="rgba(255,255,255,.3)" stroke-width="1"/>
 <polygon points="315,124 315,176 270,202 270,150" fill="url(#gRight)"/>
 <polygon points="270,202 225,176 225,124 270,150" fill="url(#gLeft)"/>
</g>
<g>
 <polygon points="345,230 380,210 415,230 380,250" fill="url(#gTop)" stroke="rgba(255,255,255,.3)" stroke-width="1"/>
 <polygon points="415,230 415,270 380,290 380,250" fill="url(#gRight)"/>
 <polygon points="380,290 345,270 345,230 380,250" fill="url(#gLeft)"/>
</g>
<g>

/* ---------- CONTA REAL (Etapa 9 / conexão inicial) ---------- */
const ppAccount = { name: 'Conta', initials: '••', email: '', walletVerified: false, loaded: false };

function ppInitials(name) {
  const parts = name.trim().split(/\s+/);
  const chars = parts.length > 1 ? parts[0][0] + parts[1][0] : name.slice(0, 2);
  return chars.toUpperCase();
}

async function ppLoadAccount() {
  if (typeof window.ppSupabase === 'undefined') return;
  const { data } = await window.ppSupabase.auth.getSession();
  if (!data.session) return; // require-auth.js já teria redirecionado antes disso

  const user = data.session.user;
  const { data: profile } = await window.ppSupabase
    .from('profiles')
    .select('full_name, wallet_verified')
    .eq('id', user.id)
    .single();

  const name = (profile && profile.full_name) || (user.email ? user.email.split('@')[0] : 'Conta');
  ppAccount.name = name;
  ppAccount.initials = ppInitials(name);
  ppAccount.email = user.email || '';
  ppAccount.walletVerified = !!(profile && profile.wallet_verified);
  ppAccount.loaded = true;
}

async function ppLogout() {
  if (typeof window.ppSupabase === 'undefined') { window.location.href = 'index.html'; return; }
  await window.ppSupabase.auth.signOut();
  window.location.href = 'index.html';
}

function go(id){
 document.getElementById('screen-landing').classList.remove('show');
 document.getElementById('screen-auth').classList.remove('show');

 if(id==='landing'){document.getElementById('screen-landing').innerHTML=SCREENS.landing();document.getElementById('screen-landing').classList.add('show');window.scrollTo(0,0);return;}
 if(id==='auth'){document.getElementById('screen-auth').innerHTML=SCREENS.auth();document.getElementById('screen-auth').classList.add('show');window.scrollTo(0,0);return;}

 const key = map[id]||'dashboard';
 const navActive = ['dashboard','acordos','explorar','servicos','carteira','perfil'].includes(key)?key:(['novo','revisao','escrow','acordo','entrega','analise','relatorio','liberado'].includes(key)?'acordos':'dashboard');
 renderShell(navActive);
 document.getElementById('appContent').innerHTML = SCREENS[key]();
 document.getElementById('appShell').classList.add('show');
 window.scrollTo(0,0);
}
