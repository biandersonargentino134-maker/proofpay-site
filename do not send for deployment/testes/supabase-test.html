<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ProofPay — teste do client Supabase</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0a0a0c;color:#e7e7ea;padding:40px;line-height:1.6}
  pre{background:#151517;padding:16px;border-radius:8px;overflow:auto}
  .ok{color:#4ade80}
  .fail{color:#f87171}
</style>
</head>
<body>
  <h1>Teste — supabase-client.js</h1>
  <p>Esta página só existe para confirmar que o client do Supabase inicializa e consegue falar com o seu projeto. Pode apagar depois do teste.</p>
  <pre id="out">Carregando...</pre>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    const out = document.getElementById('out');
    (async () => {
      const lines = [];

      if (typeof window.ppSupabase === 'undefined') {
        lines.push('❌ window.ppSupabase não foi criado. Veja o console (F12) para o erro.');
        out.innerHTML = lines.join('\n');
        out.classList.add('fail');
        return;
      }
      lines.push('✅ Client criado (window.ppSupabase existe).');

      try {
        const { data, error } = await window.ppSupabase.auth.getSession();
        if (error) {
          lines.push('❌ getSession() retornou erro: ' + error.message);
        } else {
          lines.push('✅ Conexão com o projeto Supabase respondeu normalmente.');
          lines.push('   Sessão atual: ' + (data.session ? 'existe uma sessão ativa' : 'nenhuma sessão (esperado, ainda não implementamos login)'));
        }
      } catch (e) {
        lines.push('❌ Erro de rede/config ao chamar o Supabase: ' + e.message);
      }

      out.textContent = lines.join('\n');
    })();
  </script>
</body>
</html>
