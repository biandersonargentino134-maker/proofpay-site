<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProofPay — Dashboard</title>
<link rel="stylesheet" href="style.css">
<style>
  .app-screen{min-height:100vh;background:radial-gradient(120% 90% at 50% 0%,#1c1d22 0%,#0a0a0c 60%),#0a0a0c}
  .app-header{display:flex;align-items:center;justify-content:space-between;padding:20px 28px}
  .app-main{padding:24px 28px;max-width:720px;margin:0 auto}
  .app-card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:22px 24px;margin-bottom:16px}
  .app-card h2{font-size:15px;margin:0 0 10px;color:var(--ink-soft)}
  .app-card p{margin:4px 0;font-size:14.5px}
  .app-todo{font-size:12.5px;color:var(--ink-faint);line-height:1.6}
  .wallet-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px}
  .wallet-pill.verified{background:rgba(74,222,128,.14);color:#4ade80}
  .wallet-pill.pending{background:rgba(255,255,255,.08);color:var(--ink-soft)}
</style>
</head>
<body>

<div class="app-screen">
  <header class="app-header">
    <a class="brand" href="index.html"><div class="mark"></div><span>ProofPay</span></a>
    <nav style="display:flex;align-items:center;gap:16px;font-size:13.5px">
      <a href="agreements.html" style="color:var(--ink-soft)">Meus acordos</a>
      <a href="explore.html" style="color:var(--ink-soft)">Explorar serviços</a>
      <div id="pp-account-slot">
        <a href="auth.html">Entrar</a>
      </div>
    </nav>
  </header>

  <main class="app-main">
    <h1 id="app-greeting">Dashboard</h1>

    <div class="app-card">
      <h2>Conta</h2>
      <p id="app-email">—</p>
      <p>
        Carteira:
        <span id="app-wallet-pill" class="wallet-pill pending">verificando…</span>
      </p>
    </div>

    <div class="app-card">
      <h2>Acordos</h2>
      <p>Crie e acompanhe seus acordos como contratante ou prestador.</p>
      <a class="btn btn-primary" href="agreements.html" style="margin-top:10px;display:inline-block">Ver meus acordos →</a>
      <p class="app-todo" style="margin-top:14px">
        TODO — próximas etapas: aceitar acordo (Explorar serviços),
        entrega, relatório de verificação de IA.
      </p>
    </div>

    <button type="button" class="btn btn-ghost" id="app-logout">Sair</button>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="require-auth.js"></script>
<script src="i18n.js"></script>
<script src="account-header.js"></script>
<script src="app.js"></script>
</body>
</html>
