<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProofPay — Detalhe do Acordo</title>
<link rel="stylesheet" href="style.css">
<style>
  .ad-screen{min-height:100vh;background:radial-gradient(120% 90% at 50% 0%,#1c1d22 0%,#0a0a0c 60%),#0a0a0c}
  .ad-header{display:flex;align-items:center;justify-content:space-between;padding:20px 28px}
  .ad-header nav{display:flex;gap:16px;font-size:13.5px}
  .ad-header nav a{color:var(--ink-soft)}
  .ad-main{padding:24px 28px;max-width:640px;margin:0 auto}
  .ad-card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:24px 26px}
  .ad-amount{font-size:28px;font-weight:700;margin:6px 0 14px}
  .ad-status-pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--ink-soft);margin-bottom:14px}
  .ad-desc{font-size:14.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap}
  .ad-meta{font-size:12.5px;color:var(--ink-faint);margin-top:16px}
  .ad-action-status{font-size:12.5px;margin-top:10px;min-height:16px}
  .ad-action-status.error{color:#f87171}
  .ad-action-status.success{color:#4ade80}
  .ad-action-status.pending{color:var(--ink-faint)}

  .ad-criteria-list{margin-top:8px;display:flex;flex-direction:column;gap:10px}
  .ad-criteria-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.02)}
  .ad-criteria-text{font-size:13.5px;color:var(--ink)}
  .ad-criteria-verify{font-size:12px;color:var(--ink-faint);margin-top:4px}

  /* --- Relatório de verificação (Etapa 6) --- */
  .ad-report-summary{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
  .ad-report-badge{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px}
  .ad-report-badge.verified{background:rgba(74,222,128,.14);color:#4ade80}
  .ad-report-badge.partial{background:rgba(251,191,36,.14);color:#fbbf24}
  .ad-report-badge.not_verified{background:rgba(248,113,113,.14);color:#f87171}
  .ad-report-item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .ad-report-item-head{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
  .ad-report-icon{font-size:14px}
  .ad-report-icon.verified{color:#4ade80}
  .ad-report-icon.partial{color:#fbbf24}
  .ad-report-icon.not_verified{color:#f87171}
  .ad-report-evidence{font-size:12.5px;color:var(--ink-soft);margin-top:6px;line-height:1.5}
  .ad-decision-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .ad-banner{font-size:12.5px;padding:10px 14px;border-radius:10px;margin-top:16px;line-height:1.5}
  .ad-banner.pending{background:rgba(255,255,255,.06);color:var(--ink-soft);border:1px solid var(--line)}
  .ad-banner.warning{background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.25)}
  /* --- Edição do acordo + materiais do contratante --- */
  .ad-edit-field{margin-bottom:14px}
  .ad-edit-field label{display:block;font-size:12.5px;color:var(--ink-faint);margin-bottom:6px}
  .ad-edit-field input,.ad-edit-field textarea,.ad-attach-form textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);color:var(--ink);font-family:Inter;font-size:14px}
  .ad-edit-field textarea{min-height:110px;resize:vertical}
  .ad-edit-criteria-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
  .ad-edit-criteria-item{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
  .ad-edit-criteria-item input{padding:8px 10px;font-size:13px}
  .ad-edit-remove{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink-faint);cursor:pointer;font-size:16px;line-height:1}
  .ad-edit-remove:hover{color:#f87171;border-color:#f87171}
  .ad-edit-add{font-size:12.5px;font-weight:600;color:var(--ink-soft);background:transparent;border:none;cursor:pointer;padding:4px 0}
  .ad-edit-add:hover{color:var(--ink)}
  .ad-attach-item{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13.5px}
  .ad-attach-note{font-size:13px;color:var(--ink-soft);margin-top:4px;white-space:pre-wrap}
  .ad-attach-form{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .ad-attach-form textarea{min-height:70px;resize:vertical}
  @media (max-width:560px){
    .ad-edit-criteria-item{grid-template-columns:1fr}
    .ad-edit-remove{justify-self:end}
  }
  .ad-banner.success{background:rgba(74,222,128,.1);color:#4ade80;border:1px solid rgba(74,222,128,.25)}
</style>
</head>
<body>

<div class="ad-screen">
  <header class="ad-header">
    <a class="brand" href="index.html"><div class="mark"></div><span>ProofPay</span></a>
    <nav>
      <a href="app.html">Dashboard</a>
      <a href="agreements.html">Meus acordos</a>
      <a href="explore.html">Explorar serviços</a>
    </nav>
  </header>

  <main class="ad-main">
    <div id="ad-content" class="ad-card">
      <p style="color:var(--ink-faint)">Carregando…</p>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="require-auth.js"></script>
<script src="agreement-detail.js"></script>
</body>
</html>
