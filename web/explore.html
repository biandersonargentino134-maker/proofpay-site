<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProofPay — Explorar Serviços</title>
<link rel="stylesheet" href="style.css">
<style>
  .ex-screen{min-height:100vh;background:radial-gradient(120% 90% at 50% 0%,#1c1d22 0%,#0a0a0c 60%),#0a0a0c}
  .ex-header{display:flex;align-items:center;justify-content:space-between;padding:20px 28px}
  .ex-header nav{display:flex;gap:16px;font-size:13.5px}
  .ex-header nav a{color:var(--ink-soft)}
  .ex-main{padding:24px 28px;max-width:760px;margin:0 auto}
  .ex-grid{display:grid;gap:14px}
  .ex-card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:18px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:var(--ink)}
  .ex-card:hover{border-color:rgba(255,255,255,.25)}
  .ex-card-title{font-size:15px;font-weight:600}
  .ex-card-meta{font-size:12.5px;color:var(--ink-faint);margin-top:2px}
  .ex-amount{font-size:15px;font-weight:700;white-space:nowrap}
  .ex-empty{font-size:13.5px;color:var(--ink-faint)}
</style>
</head>
<body>

<div class="ex-screen">
  <header class="ex-header">
    <a class="brand" href="index.html"><div class="mark"></div><span>ProofPay</span></a>
    <nav>
      <a href="app.html">Dashboard</a>
      <a href="agreements.html">Meus acordos</a>
      <a href="explore.html">Explorar serviços</a>
    </nav>
  </header>

  <main class="ex-main">
    <h1 style="margin-bottom:18px">Explorar serviços</h1>
    <p style="font-size:13.5px;color:var(--ink-faint);margin-bottom:20px">
      Acordos abertos, publicados por outros contratantes, aguardando um prestador aceitar.
    </p>
    <div id="ex-list" class="ex-grid"><p class="ex-empty">Carregando…</p></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="require-auth.js"></script>
<script src="explore.js"></script>
</body>
</html>
