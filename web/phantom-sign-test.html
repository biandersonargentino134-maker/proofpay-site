<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    ProofPay — Teste de assinatura Phantom
  </title>

  <style>
    body {
      margin: 0;
      background: #0a0a0c;
      color: #f5f5f6;
      font-family: Arial, sans-serif;
      padding: 40px 20px;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    h2 {
      margin-top: 0;
      color: #b5b5ba;
      font-size: 18px;
      font-weight: normal;
    }

    .card {
      margin-top: 28px;
      background: #17171b;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 24px;
    }

    .row {
      margin-bottom: 20px;
    }

    .label {
      display: block;
      color: #9c9ca3;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .value {
      font-weight: bold;
    }

    .address,
    .signature,
    .message {
      overflow-wrap: anywhere;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.6;
    }

    .status {
      font-weight: bold;
      color: #fbbf24;
    }

    .online {
      color: #4ade80;
    }

    .error {
      color: #f87171;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 14px 18px;
      border: 0;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #ffffff;
      color: #111111;
    }

    button.secondary {
      margin-top: 12px;
      background: #28282e;
      color: #ffffff;
      border: 1px solid #444;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .success-box {
      display: none;
      margin-top: 20px;
      padding: 14px;
      background: rgba(74, 222, 128, 0.08);
      border: 1px solid rgba(74, 222, 128, 0.25);
      border-radius: 10px;
      color: #b7f7c8;
      line-height: 1.5;
    }

    .error-box {
      display: none;
      margin-top: 20px;
      padding: 14px;
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.25);
      border-radius: 10px;
      color: #fecaca;
      line-height: 1.5;
    }

    .note {
      margin-top: 20px;
      font-size: 13px;
      line-height: 1.6;
      color: #9c9ca3;
    }
  </style>
</head>

<body>

  <main>

    <h1>
      ProofPay
    </h1>

    <h2>
      Teste de assinatura com Phantom
    </h2>


    <div class="card">

      <div class="row">

        <span class="label">
          Phantom
        </span>

        <span
          id="phantom-status"
          class="status"
        >
          Verificando...
        </span>

      </div>


      <div class="row">

        <span class="label">
          Carteira conectada
        </span>

        <div
          id="wallet-address"
          class="address"
        >
          —
        </div>

      </div>


      <div class="row">

        <span class="label">
          Mensagem que será assinada
        </span>

        <div
          id="message"
          class="message"
        >
          —
        </div>

      </div>


      <button
        type="button"
        id="connect-button"
      >
        Conectar Phantom
      </button>


      <button
        type="button"
        id="sign-button"
        class="secondary"
        disabled
      >
        Assinar mensagem
      </button>


      <div
        id="signature-container"
        class="row"
        style="display:none; margin-top:24px;"
      >

        <span class="label">
          Assinatura gerada
        </span>

        <div
          id="signature"
          class="signature"
        >
        </div>

      </div>


      <div
        id="success-box"
        class="success-box"
      >
      </div>


      <div
        id="error-box"
        class="error-box"
      >
      </div>


      <p class="note">

        Este teste solicita apenas uma assinatura
        de mensagem.

        Assinar esta mensagem não envia transação,
        não transfere SOL e não movimenta nenhum token.

      </p>

    </div>

  </main>


  <script>

    const phantomStatusEl =
      document.getElementById(
        "phantom-status"
      );

    const walletAddressEl =
      document.getElementById(
        "wallet-address"
      );

    const messageEl =
      document.getElementById(
        "message"
      );

    const connectButton =
      document.getElementById(
        "connect-button"
      );

    const signButton =
      document.getElementById(
        "sign-button"
      );

    const signatureContainer =
      document.getElementById(
        "signature-container"
      );

    const signatureEl =
      document.getElementById(
        "signature"
      );

    const successBox =
      document.getElementById(
        "success-box"
      );

    const errorBox =
      document.getElementById(
        "error-box"
      );


    let provider = null;

    let connectedAddress = null;


    function getPhantomProvider() {

      if (
        window.phantom &&
        window.phantom.solana &&
        window.phantom.solana.isPhantom
      ) {
        return window.phantom.solana;
      }


      if (
        window.solana &&
        window.solana.isPhantom
      ) {
        return window.solana;
      }


      return null;
    }


    function bytesToBase64(bytes) {

      let binary = "";

      for (
        let i = 0;
        i < bytes.length;
        i++
      ) {
        binary +=
          String.fromCharCode(
            bytes[i]
          );
      }

      return window.btoa(
        binary
      );
    }


    function createMessage() {

      return [
        "ProofPay",
        "",
        "Teste de controle da carteira.",
        "",
        "Esta assinatura NÃO autoriza pagamentos.",
        "Esta assinatura NÃO movimenta tokens.",
        "",
        "Carteira:",
        connectedAddress,
        "",
        "Site:",
        window.location.origin,
        "",
        "Data:",
        new Date().toISOString()
      ].join("\n");
    }


    function showError(message) {

      errorBox.textContent =
        message;

      errorBox.style.display =
        "block";

      successBox.style.display =
        "none";
    }


    function clearMessages() {

      errorBox.style.display =
        "none";

      successBox.style.display =
        "none";
    }


    async function connectWallet() {

      clearMessages();

      provider =
        getPhantomProvider();


      if (!provider) {

        phantomStatusEl.textContent =
          "NÃO ENCONTRADA";

        phantomStatusEl.className =
          "status error";

        showError(
          "A extensão Phantom não foi encontrada neste navegador."
        );

        return;
      }


      phantomStatusEl.textContent =
        "ENCONTRADA";

      phantomStatusEl.className =
        "status online";


      connectButton.disabled =
        true;

      connectButton.textContent =
        "Abrindo Phantom...";


      try {

        const response =
          await provider.connect();


        connectedAddress =
          response.publicKey.toString();


        walletAddressEl.textContent =
          connectedAddress;


        connectButton.textContent =
          "Phantom conectada";


        signButton.disabled =
          false;


        const message =
          createMessage();


        messageEl.textContent =
          message;


      } catch (error) {

        console.error(
          "[ProofPay] Erro de conexão:",
          error
        );


        connectButton.disabled =
          false;

        connectButton.textContent =
          "Conectar Phantom";


        showError(
          "A conexão com a Phantom foi cancelada ou ocorreu um erro."
        );

      }

    }


    async function signMessage() {

      clearMessages();


      if (
        !provider ||
        !connectedAddress
      ) {

        showError(
          "Conecte a Phantom antes de assinar."
        );

        return;
      }


      signButton.disabled =
        true;

      signButton.textContent =
        "Aguardando assinatura...";


      try {

        const message =
          createMessage();


        messageEl.textContent =
          message;


        const encodedMessage =
          new TextEncoder()
            .encode(
              message
            );


        const result =
          await provider.signMessage(
            encodedMessage,
            "utf8"
          );


        const signatureBase64 =
          bytesToBase64(
            result.signature
          );


        signatureEl.textContent =
          signatureBase64;


        signatureContainer.style.display =
          "block";


        successBox.textContent =
          "Mensagem assinada com sucesso. A Phantom confirmou que esta carteira autorizou a assinatura. Nenhuma transação foi enviada e nenhum token foi movimentado.";


        successBox.style.display =
          "block";


        console.log(
          "[ProofPay] Carteira:",
          connectedAddress
        );


        console.log(
          "[ProofPay] Assinatura:",
          signatureBase64
        );


      } catch (error) {

        console.error(
          "[ProofPay] Erro de assinatura:",
          error
        );


        showError(
          "A assinatura foi cancelada ou ocorreu um erro na Phantom."
        );

      } finally {

        signButton.disabled =
          false;

        signButton.textContent =
          "Assinar nova mensagem";

      }

    }


    connectButton.addEventListener(
      "click",
      connectWallet
    );


    signButton.addEventListener(
      "click",
      signMessage
    );


    async function initialize() {

      provider =
        getPhantomProvider();


      if (!provider) {

        phantomStatusEl.textContent =
          "NÃO ENCONTRADA";

        phantomStatusEl.className =
          "status error";

        return;
      }


      phantomStatusEl.textContent =
        "ENCONTRADA";

      phantomStatusEl.className =
        "status online";


      // Se o site já foi autorizado antes,
      // tenta reconectar sem abrir popup.

      try {

        const response =
          await provider.connect({
            onlyIfTrusted: true
          });


        connectedAddress =
          response.publicKey.toString();


        walletAddressEl.textContent =
          connectedAddress;


        connectButton.textContent =
          "Phantom conectada";


        connectButton.disabled =
          true;


        signButton.disabled =
          false;


        messageEl.textContent =
          createMessage();


      } catch (error) {

        // Normal quando ainda não existe
        // autorização anterior.

      }

    }


    initialize();

  </script>

</body>
</html>
